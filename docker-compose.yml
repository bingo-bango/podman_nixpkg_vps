# docker-compose.yml
networks:
  web:
    name: web
    external: false
  internal:
    name: internal
    external: false

services:
  wireguard:
    image: lscr.io/linuxserver/wireguard:latest
    container_name: wireguard
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TIMEZONE}
    volumes:
      - ./config/wireguard:/config
    ports:
      - "51456:51456/udp"
    network_mode: host
    restart: always
  traefik:
    image: docker.io/library/traefik:v3.1
    container_name: traefik
    restart: always
    command:
      - --certificatesresolvers.lets-encrypt.acme.email=${ACME_EMAIL}
    labels:
      - "io.containers.autoupdate=registry"
      - "traefik.enable=true"
      # Basic Auth Middleware definition from .env
      - "traefik.http.middlewares.simpleAuth.basicauth.users=${TRAEFIK_BASIC_AUTH_USERS}"
      # Dashboard Router protected by simpleAuth
      - "traefik.http.routers.api.rule=Host(`monitor.${STACK_HOSTNAME}`)"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.service=api@internal"
      - "traefik.http.routers.api.middlewares=simpleAuth"
      - "traefik.http.routers.api.tls=true"
      - "traefik.http.routers.api.tls.certresolver=lets-encrypt"
      # GeoBlock middleware (plugin)
      - "traefik.http.middlewares.my-GeoBlock.plugin.geoblock.silentStartUp=false"
      - "traefik.http.middlewares.my-GeoBlock.plugin.geoblock.allowLocalRequests=true"
      - "traefik.http.middlewares.my-GeoBlock.plugin.geoblock.logLocalRequests=false"
      - "traefik.http.middlewares.my-GeoBlock.plugin.geoblock.logAllowedRequests=false"
      - "traefik.http.middlewares.my-GeoBlock.plugin.geoblock.logApiRequests=false"
      - "traefik.http.middlewares.my-GeoBlock.plugin.geoblock.api=https://get.geojs.io/v1/ip/country/{ip}"
      - "traefik.http.middlewares.my-GeoBlock.plugin.geoblock.apiTimeoutMs=500"
      - "traefik.http.middlewares.my-GeoBlock.plugin.geoblock.cacheSize=25"
      - "traefik.http.middlewares.my-GeoBlock.plugin.geoblock.forceMonthlyUpdate=true"
      - "traefik.http.middlewares.my-GeoBlock.plugin.geoblock.allowUnknownCountries=false"
      - "traefik.http.middlewares.my-GeoBlock.plugin.geoblock.unknownCountryApiResponse=nil"
      - "traefik.http.middlewares.my-GeoBlock.plugin.geoblock.countries=${GEOBLOCK_COUNTRIES}"
      # Home Assistant
      - "traefik.http.routers.homeassistant.rule=Host(`ha.${STACK_HOSTNAME}`)"
      - "traefik.http.routers.homeassistant.entrypoints=websecure"
      - "traefik.http.routers.homeassistant.middlewares=my-GeoBlock"
      - "traefik.http.routers.homeassistant.tls=true"
      - "traefik.http.routers.homeassistant.tls.certresolver=lets-encrypt"
      - "traefik.http.routers.homeassistant.service=homeassistant"
      - "traefik.http.services.homeassistant.loadbalancer.server.url=https://10.13.13.2:9444"
      # Nextcloud
      - "traefik.http.routers.nextcloud.rule=Host(`nuage.${STACK_HOSTNAME}`)"
      - "traefik.http.routers.nextcloud.entrypoints=websecure"
      - "traefik.http.routers.nextcloud.middlewares=my-GeoBlock"
      - "traefik.http.routers.nextcloud.tls=true"
      - "traefik.http.routers.nextcloud.tls.certresolver=lets-encrypt"
      - "traefik.http.routers.nextcloud.service=nextcloud"
      - "traefik.http.services.nextcloud.loadbalancer.server.url=https://10.13.13.2:9443"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Bind user-space Podman socket (XDG_RUNTIME_DIR default UID 100x)
      - ${XDG_RUNTIME_DIR}/podman/podman.sock:/var/run/docker.sock:ro
      - ./config/traefik/traefik.yaml:/traefik.yaml:ro
      - ./config/traefik/acme.json:/letsencrypt/acme.json
    networks:
      - web
      - internal

  vaultwarden:
    image: docker.io/vaultwarden/server:latest
    container_name: vaultwarden
    restart: always
    labels:
      - "io.containers.autoupdate=registry"
      - "traefik.enable=true"
      - "traefik.http.routers.vaultwarden.rule=Host(`vault.${STACK_HOSTNAME}`)"
      - "traefik.http.routers.vaultwarden.service=vaultwarden"
      - "traefik.http.routers.vaultwarden.entrypoints=websecure"
      - "traefik.http.services.vaultwarden.loadbalancer.server.port=80"
      - "traefik.http.routers.vaultwarden.tls=true"
      - "traefik.http.routers.vaultwarden.tls.certresolver=lets-encrypt"
      - "traefik.http.services.vaultwarden.loadbalancer.passhostheader=true"
      - "traefik.http.routers.vaultwarden.middlewares=compresstraefik"
      - "traefik.http.routers.vaultwarden.middlewares=my-GeoBlock"
      - "traefik.http.middlewares.compresstraefik.compress=true"
    environment:
      - DOMAIN=https://vault.${STACK_HOSTNAME}
      - LOG_FILE=/data/access.log
      - SIGNUPS_DOMAINS_WHITELIST=${STACK_HOSTNAME}
      - SIGNUPS_VERIFY=true
      - ADMIN_TOKEN=${VW_ADMIN_TOKEN}
    volumes:
      - ./config/vaultwarden:/data
    networks:
      - internal
    depends_on:
      - traefik
